[package]
name = "tempo-core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bytes = "1.12.1"
chrono = "0.4.45"
dirs = "7.0.0"
dunce = "1.0.5"
futures-util = "0.3.34"
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
md5 = "0.8.1"
notify = "8.2.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlite-vec = "0.1.9"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
unicode-normalization = "0.1.26"
ureq = { version = "3.4.2", features = ["platform-verifier"] }
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
walkdir = "2.5.0"
