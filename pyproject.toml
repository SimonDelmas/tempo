[project]
name = "tempo"
version = "0.1.0"
description = "Notes, tâches et rapports assistés par LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "watchdog>=5.0",
    "openai>=1.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
tempo = "tempo.main:run"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/tempo"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
